services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    working_dir: /app
    volumes:
      - .:/app
      - nvr_data:/data
      - /app/frontend/node_modules
      - /app/frontend/dist
    command: deno run --allow-net --allow-read --allow-write --allow-run --watch --allow-env backend/main.ts
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - WORKER_URL=http://worker:5000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.app
    working_dir: /app/frontend
    volumes:
      - .:/app
    command: deno run --unstable-no-legacy-abort -A npm:vite --host
    ports:
      - "5173:5173"
    depends_on:
      - app
    restart: unless-stopped

  worker:
    build: ./worker
    volumes:
      - .:/app
      - nvr_data:/data
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    environment:
      - DATA_DIR=/data
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  test:
    profiles:
      - test
    image: mcr.microsoft.com/playwright:v1.50.1-noble
    working_dir: /app/tests
    volumes:
      - .:/app
    depends_on:
      - app
      - frontend
    ipc: host
    command: sh -c "npm install && tail -f /dev/null"

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nvr_data:/data:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped

volumes:
  nvr_data:
    driver: rclone
    driver_opts:
      remote: "${RCLONE_REMOTE}"
      vfs-cache-mode: "${RCLONE_VFS_CACHE_MODE:-full}"
      vfs-cache-max-size: "${RCLONE_VFS_CACHE_MAX_SIZE:-50G}"
      vfs-cache-max-age: "${RCLONE_VFS_CACHE_MAX_AGE:-24h}"
      dir-cache-time: "${RCLONE_DIR_CACHE_TIME:-2h}"
      timeout: "${RCLONE_TIMEOUT:-10s}"
      contimeout: "${RCLONE_CONTIMEOUT:-5s}"
      low-level-retries: "${RCLONE_LOW_LEVEL_RETRIES:-3}"
      retries: "${RCLONE_RETRIES:-3}"
      allow_other: "true"
