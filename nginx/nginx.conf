proxy_cache_path /var/cache/nginx/thumbnails levels=1:2 keys_zone=thumbnails:16m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    # HTTP/2 Tuning for High Concurrency Video Chunks
    http2_max_concurrent_streams 512;
    http2_body_preread_size 64k;
    keepalive_requests 5000;

    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Dynamic M3U8 Playlist Handling (Backend validates, regenerates, and caches)
    location ~* \.m3u8$ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Standard Video Serving
    location /videos/ {
        alias /data/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;

        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;

        # Fallback to backend if .m3u8 sidecar has not been generated on disk yet
        error_page 404 = @generate_m3u8;
    }

    location @generate_m3u8 {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Thumbnail & Visual Summary Proxy (NVMe + VFS Page Cache)
    location /thumbnail/ {
        proxy_pass http://thumbnail:8080/thumbnail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_cache thumbnails;
        proxy_cache_key "$uri?$args";
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_lock_age 120s;
        proxy_cache_lock_timeout 120s;
        proxy_cache_bypass $http_cache_control;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # Important for SSE
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off; # Important for SSE/Streaming
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend Proxy (Vite Dev Server)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
